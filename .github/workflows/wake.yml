# Wakes The Bench every morning. Render's free plan lets the app sleep from 3 to 5 am India time (see "keep-awake"
# in server.js), and a sleeping app cannot wake itself. One visit just after 5 am wakes it, and the app keeps itself
# awake from then on, so the first person of the day does not wait. Free: the repository is public.
# GitHub may run scheduled jobs a few minutes late, so there are two tries. "Run workflow" on GitHub runs it by hand.
name: Wake the site
on:
  schedule:
    - cron: '35 23 * * *' # 05:05 India time
    - cron: '5 0 * * *'   # 05:35 India time
  workflow_dispatch:
permissions: {}
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the site
        run: curl --silent --show-error --fail --retry 5 --retry-delay 15 --retry-all-errors --max-time 120 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://the-bench-xcss.onrender.com/healthz
